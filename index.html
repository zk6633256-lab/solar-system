<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Solar System Demo</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <!-- Loading overlay -->
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <p>Loading Solar System…</p>
    </div>

    <!-- Top bar -->
    <header class="topbar">
      <h1>🌞 Solar System</h1>
      <div class="topbar-actions">
        <button id="btn-pause" class="btn" title="Pause / resume orbits">⏸ Pause</button>
        <button id="btn-labels" class="btn" title="Toggle planet labels">🏷 Labels</button>
        <button id="btn-orbits" class="btn" title="Toggle orbit rings">⭕ Orbits</button>
        <button id="btn-theme" class="btn" title="Toggle light / dark UI">🌙</button>
      </div>
    </header>

    <!-- Left control panel -->
    <aside class="panel" id="panel">
      <div class="panel-header">
        <h2>Controls</h2>
        <button id="btn-panel-toggle" class="btn btn-icon" title="Collapse panel">«</button>
      </div>

      <section class="control-group">
        <label for="speed">Simulation speed <span id="speed-val">1.0×</span></label>
        <input type="range" id="speed" min="0" max="5" step="0.1" value="1" />
      </section>

      <section class="control-group">
        <label for="zoom">Camera distance <span id="zoom-val">100%</span></label>
        <input type="range" id="zoom" min="20" max="300" step="1" value="100" />
      </section>

      <section class="control-group">
        <label class="checkbox">
          <input type="checkbox" id="chk-real-scale" />
          <span>Relative planet sizes</span>
        </label>
        <p class="hint">Uses a compressed scale so small planets stay visible.</p>
      </section>

      <section class="control-group">
        <label>Focus object</label>
        <div class="chip-list" id="focus-list"></div>
      </section>

      <section class="control-group info" id="info-box">
        <h3 id="info-name">Sun</h3>
        <dl id="info-stats"></dl>
        <p class="hint">Click a planet to inspect it.</p>
      </section>
    </aside>

    <!-- Mobile bottom nav -->
    <nav class="mobile-nav">
      <button class="btn" id="m-pause">⏸</button>
      <button class="btn" id="m-labels">🏷</button>
      <button class="btn" id="m-orbits">⭕</button>
      <button class="btn" id="m-panel">⚙️</button>
    </nav>

    <!-- Labels layer -->
    <div id="labels" class="labels"></div>

    <footer class="credits">
      Built with Three.js · drag to orbit · scroll to zoom
    </footer>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
